version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres-db
    restart: always
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_secure_password123
      POSTGRES_DB: auth_learning_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
